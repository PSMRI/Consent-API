# Consent-API local configuration TEMPLATE (placeholders only - never commit real values).
# Copy to common_local.properties (git-ignored) and build with -DENV_VAR=local.

server.port=8100

# Consent data store: db_identity only (constitution, FR-019)
spring.datasource.url=jdbc:mysql://localhost:3306/db_identity
spring.datasource.username=<db_user>
spring.datasource.password=<db_password>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis: the SAME instance Common-API uses (login sessions and logout denylist)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=

# Same signing secret as Common-API (at least 32 characters)
jwt.secret=<same secret as Common-API>

# Comma-separated browser origins; * is a wildcard. Empty = all browser origins refused.
cors.allowed-origins=http://localhost:*

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Consent capture (feature 002)
# Base64 32-byte AES key, e.g. `openssl rand -base64 32`. A secret: never commit a real one.
consent.encryption.key=91/8HVw9yKxsv2L12sPE/mwpSX69WxqOA09w+NTHHh8=
consent.evidence.storage-dir=/home/nd/consent-evidence
consent.common-api.base-url=http://localhost:8083
consent.notice.audio-base-url=
# Longest doctor access a patient can approve, in days (TODO-LEGAL; default 30)
consent.access-grant.max-days=30

logging.file.name=logs/consent-api.log
# Feature 004 (optional overrides; defaults in application.properties)
# SMS sent after a consent save (TODO-LEGAL wording: no programme or health condition)
#consent.sms.template=Your consent is recorded. Consent ID: {consentId}. Grievance: {grievance}
#consent.sms.timeout-ms=2000
# Feature 006: shared with Common-API's consent-api.service-key; a long random value, never committed.
#consent.admin.service-key=<generate with: openssl rand -base64 32>
#consent.translation.provider=
# Unlinked evidence is removed after this many hours (TODO-DPO)
#consent.evidence.unlinked-retention-hours=24
