# Consent-API Docker configuration. Values come from environment variables at runtime,
# using the same variable names as Common-API. An unset variable stops start-up.

spring.datasource.url=${DATABASE_IDENTITY_URL}
spring.datasource.username=${DATABASE_IDENTITY_USERNAME}
spring.datasource.password=${DATABASE_IDENTITY_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.redis.host=${REDIS_HOST}

jwt.secret=${JWT_SECRET_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=${SWAGGER_DOC_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_DOC_ENABLED}

consent.encryption.key=${CONSENT_ENCRYPTION_KEY}
consent.evidence.storage-dir=${EVIDENCE_STORAGE_DIR}
consent.common-api.base-url=${COMMON_API_BASE_URL}
consent.notice.audio-base-url=${NOTICE_AUDIO_BASE_URL}

logging.file.name=logs/consent-api.log
