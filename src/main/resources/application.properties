spring.application.name=consent-api

# JPA: no schema changes at runtime (constitution Principle VIII, FR-019)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Column names are used exactly as written in @Column (as in Common-API)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# tomcat-jdbc pool (as in Common-API) + bounded waits so /health answers within 2 s
spring.datasource.type=org.apache.tomcat.jdbc.pool.DataSource
spring.datasource.tomcat.initial-size=5
spring.datasource.tomcat.max-active=30
spring.datasource.tomcat.max-idle=15
spring.datasource.tomcat.min-idle=5
spring.datasource.tomcat.min-evictable-idle-time-millis=15000
spring.datasource.tomcat.remove-abandoned=true
spring.datasource.tomcat.logAbandoned=true
spring.datasource.tomcat.remove-abandoned-timeout=600
spring.datasource.tomcat.max-wait=1500
spring.datasource.tomcat.validation-query-timeout=1

# Redis (same keys as Common-API; bound in RedisConfig)
spring.redis.port=6379
spring.redis.password=

# Login session (same keys and defaults as Common-API)
iemr.extend.expiry.time=true
iemr.session.expiry.time=7200
enableIPValidation=false

# API documentation: off unless the environment turns it on
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Consent-API settings
consent.request.max-body-bytes=1048576
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
consent.health.check-timeout-ms=1500
consent.redis.timeout-ms=1500
consent.rate-limit.retry-after-seconds=60

# Feature 002 - consent capture (TODO-DPO values are placeholders until signed off)
consent.evidence.max-bytes=10485760
consent.evidence.voice-min-seconds=30
consent.evidence.voice-max-seconds=60
consent.evidence.allowed-content-types=audio/webm,audio/ogg,audio/mpeg,audio/wav,image/jpeg,image/png
consent.capture.max-skew-minutes=1440
consent.common-api.timeout-ms=3000
consent.otp.ttl-seconds=300
consent.otp.retention-minutes=30
consent.otp.max-attempts=5
# Doctor access grants (feature 003). max-days is TODO-LEGAL.
consent.access-grant.max-days=30
consent.access-grant.replay-hours=24

# Every error uses the standard ApiResponse body
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false

logging.level.root=INFO
logging.level.com.iemr=INFO
